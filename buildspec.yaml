version: 0.2

phases:
  pre_build:
    commands:
      - echo "======================================"
      - echo "CHECKING CODEBUILD SOURCE"
      - echo "======================================"
      - echo "Source version:"
      - echo "$CODEBUILD_SOURCE_VERSION"
      - echo "Resolved commit:"
      - echo "$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - echo "Latest commit:"
      - git log -1 --pretty=format:"%h - %s"
      - echo ""

      - echo "======================================"
      - echo "CHECKING DOCKERFILE"
      - echo "======================================"
      - cat Dockerfile
      - echo ""

      - echo "======================================"
      - echo "CHECKING DATABASE CONFIGURATION"
      - echo "======================================"
      - grep "spring.datasource.url" src/main/resources/application.properties
      - echo ""

      - echo "======================================"
      - echo "BUILDING SPRING BOOT APPLICATION"
      - echo "======================================"
      - mvn clean install

      - echo "======================================"
      - echo "CHECKING GENERATED JAR"
      - echo "======================================"
      - ls -lh target/
      - echo ""

      - echo "======================================"
      - echo "LOGGING IN TO AMAZON ECR"
      - echo "======================================"
      - aws --version

      - REPOSITORY_URI=881490091535.dkr.ecr.us-east-1.amazonaws.com/employee-curd

      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $REPOSITORY_URI

      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')

      - echo "Repository: $REPOSITORY_URI"
      - echo "Commit: $COMMIT_HASH"
      - echo "Image tag: $IMAGE_TAG"

  build:
    commands:
      - echo "======================================"
      - echo "DOCKER BUILD"
      - echo "======================================"
      - echo "Build started on `date`"

      - docker build --no-cache -t $REPOSITORY_URI:latest .

      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "======================================"
      - echo "PUSHING DOCKER IMAGE"
      - echo "======================================"
      - echo "Build completed on `date`"

      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - echo "======================================"
      - echo "CREATING IMAGE DEFINITIONS"
      - echo "======================================"

      - DOCKER_CONTAINER_NAME=employee-curd

      - printf '[{"name":"%s","imageUri":"%s"}]' $DOCKER_CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      - echo "Container name:"
      - echo $DOCKER_CONTAINER_NAME

      - echo "Image:"
      - echo $REPOSITORY_URI:$IMAGE_TAG

      - echo "imagedefinitions.json:"
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - target/employee-curd.jar